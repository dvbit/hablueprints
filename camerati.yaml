blueprint:
  name: AI Camera Describer
  description: >
    Uses an AI Task entity to describe a camera directly via media-source.
    Stores the description in a text helper, logs to the Logbook, optionally
    sends a mobile notification, announces via TTS, and updates a persistent
    notification in the sidebar.
  domain: automation
  input:

    # ── CAMERA ───────────────────────────────────────────────────────────────
    camera_source:
      name: Camera Media Source
      description: >
        Full media source URI for your camera.
        Example: media-source://camera/camera.front_door
      default: "media-source://camera/camera.your_camera"
      selector:
        text:

    # ── AI ────────────────────────────────────────────────────────────────────
    ai_task_entity:
      name: AI Task Entity
      description: >
        The ai_task.* entity to use. Add an AI Task sub-entry in your AI
        integration first under Settings → Integrations → your AI → Configure.
      selector:
        entity:
          domain: ai_task

    ai_instructions:
      name: AI Instructions
      default: >
        You are a home security assistant.
        Describe what you see in this camera image clearly and concisely.
        Note any people, vehicles, animals, or unusual activity.
        Keep the description under 3 sentences.
      selector:
        text:
          multiline: true

    # ── TEXT HELPER ───────────────────────────────────────────────────────────
    text_helper:
      name: Text Helper
      description: input_text helper to store the AI description.
      selector:
        entity:
          domain: input_text

    # ── TRIGGER ───────────────────────────────────────────────────────────────
    use_motion_trigger:
      name: Use Motion Sensor Trigger
      description: >
        Enable to trigger on a binary sensor instead of a time pattern.
      default: false
      selector:
        boolean:

    trigger_entity:
      name: Trigger Entity
      description: Binary sensor, only used when Use Motion Sensor Trigger is on.
      default: "binary_sensor.placeholder"
      selector:
        entity:
          domain: binary_sensor

    time_pattern_minutes:
      name: Time Pattern — Minutes Interval
      description: >
        Used only when Use Motion Sensor Trigger is off.
        /5 = every 5 min, /30 = every 30 min, etc.
      default: "/30"
      selector:
        text:

    # ── COOLDOWN ──────────────────────────────────────────────────────────────
    use_cooldown_helper:
      name: Enable Cooldown
      description: >
        Prevent the automation from firing too often.
        Requires an input_datetime helper below.
      default: false
      selector:
        boolean:

    cooldown_minutes:
      name: Cooldown (minutes)
      default: 5
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
          mode: slider

    cooldown_helper:
      name: Cooldown Helper (input_datetime)
      description: Only used when Enable Cooldown is on.
      default: "input_datetime.placeholder"
      selector:
        entity:
          domain: input_datetime

    # ── LOGBOOK ───────────────────────────────────────────────────────────────
    logbook_enabled:
      name: Enable Logbook Logging
      default: true
      selector:
        boolean:

    # ── PERSISTENT NOTIFICATION ───────────────────────────────────────────────
    persistent_notification_enabled:
      name: Enable Persistent Notification Panel
      description: Creates/updates a persistent notification in the HA sidebar.
      default: true
      selector:
        boolean:

    persistent_notification_id:
      name: Persistent Notification ID
      description: Use only letters, numbers and underscores.
      default: "ai_camera"
      selector:
        text:

    # ── MOBILE NOTIFICATION ───────────────────────────────────────────────────
    use_notify:
      name: Enable Mobile Notification
      default: false
      selector:
        boolean:

    notify_target:
      name: Mobile Notification Target
      description: e.g. notify.mobile_app_your_phone
      default: "notify.notify"
      selector:
        text:

    notify_title:
      name: Notification Title
      default: "📷 Camera AI Update"
      selector:
        text:

    # ── TTS ───────────────────────────────────────────────────────────────────
    tts_enabled:
      name: Enable TTS Announcement
      default: false
      selector:
        boolean:

    tts_target:
      name: TTS Media Player
      description: Only used when Enable TTS is on.
      default: "media_player.placeholder"
      selector:
        entity:
          domain: media_player

    tts_service:
      name: TTS Service
      description: e.g. tts.cloud_say, tts.google_translate_say, tts.piper
      default: "tts.cloud_say"
      selector:
        text:

    tts_language:
      name: TTS Language
      description: e.g. en-US, it-IT, de-DE
      default: "en-US"
      selector:
        text:

    tts_only_when_home:
      name: Announce only when someone is home
      default: true
      selector:
        boolean:

    use_tts_person:
      name: Enable home presence check
      default: false
      selector:
        boolean:

    tts_person:
      name: Person for home presence check
      description: Only used when Enable home presence check is on.
      default: "person.placeholder"
      selector:
        entity:

# ── TRIGGERS ──────────────────────────────────────────────────────────────────
triggers:
  - trigger: state
    entity_id: !input trigger_entity
    to: "on"
    id: sensor_trigger

  - trigger: time_pattern
    minutes: !input time_pattern_minutes
    id: time_trigger

# ── VARIABLES ─────────────────────────────────────────────────────────────────
variables:
  use_motion_trigger: !input use_motion_trigger
  use_cooldown_helper: !input use_cooldown_helper
  cooldown_minutes: !input cooldown_minutes
  cooldown_helper: !input cooldown_helper
  logbook_enabled: !input logbook_enabled
  persistent_notification_enabled: !input persistent_notification_enabled
  persistent_notification_id: !input persistent_notification_id
  use_notify: !input use_notify
  notify_target: !input notify_target
  tts_enabled: !input tts_enabled
  tts_target: !input tts_target
  tts_service: !input tts_service
  tts_language: !input tts_language
  tts_only_when_home: !input tts_only_when_home
  use_tts_person: !input use_tts_person
  tts_person: !input tts_person

# ── CONDITIONS ────────────────────────────────────────────────────────────────
conditions:
  - condition: template
    value_template: >
      {% if use_motion_trigger %}
        {{ trigger.id == 'sensor_trigger' }}
      {% else %}
        {{ trigger.id == 'time_trigger' }}
      {% endif %}

  - condition: template
    value_template: >
      {% if not use_cooldown_helper or cooldown_minutes == 0 %}
        true
      {% else %}
        {% set last = states(cooldown_helper) %}
        {% if last in ['unknown', 'unavailable', ''] %}
          true
        {% else %}
          {{ (now() - strptime(last, '%Y-%m-%d %H:%M:%S')).total_seconds() > cooldown_minutes * 60 }}
        {% endif %}
      {% endif %}

# ── ACTIONS ───────────────────────────────────────────────────────────────────
actions:

  - alias: Update cooldown timestamp
    if:
      - condition: template
        value_template: "{{ use_cooldown_helper and cooldown_minutes > 0 }}"
    then:
      - action: input_datetime.set_datetime
        data:
          entity_id: "{{ cooldown_helper }}"
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - alias: AI describe camera
    action: ai_task.generate_data
    data:
      entity_id: !input ai_task_entity
      task_name: "Describe camera"
      instructions: !input ai_instructions
      attachments:
        media_content_id: !input camera_source
        media_content_type: image/jpeg
    response_variable: ai_response

  - alias: Store in text helper
    action: input_text.set_value
    data:
      entity_id: !input text_helper
      value: "{{ ai_response.data }}"

  - alias: Logbook entry
    if:
      - condition: template
        value_template: "{{ logbook_enabled }}"
    then:
      - action: logbook.log
        data:
          name: "AI Camera"
          message: "{{ ai_response.data }}"
          entity_id: !input text_helper

  - alias: Persistent notification
    if:
      - condition: template
        value_template: "{{ persistent_notification_enabled }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "{{ persistent_notification_id }}"
          title: "📷 AI Camera"
          message: "**{{ now().strftime('%d/%m/%Y %H:%M') }}**\n\n{{ ai_response.data }}"

  - alias: Mobile notification
    if:
      - condition: template
        value_template: "{{ use_notify }}"
    then:
      - action: "{{ notify_target }}"
        data:
          title: !input notify_title
          message: "{{ ai_response.data }}"

  - alias: TTS announcement
    if:
      - condition: template
        value_template: >
          {{ tts_enabled and tts_target != 'media_player.placeholder' }}
      - condition: template
        value_template: >
          {% if tts_only_when_home and use_tts_person %}
            {{ is_state(tts_person, 'home') }}
          {% else %}
            true
          {% endif %}
    then:
      - action: "{{ tts_service }}"
        data:
          entity_id: "{{ tts_target }}"
          message: "{{ ai_response.data }}"
          language: "{{ tts_language }}"

mode: single
max_exceeded: silent
